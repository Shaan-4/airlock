[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock"
version = "0.1.0"
description = "A firewall for tool-using AI agents: taint tracking, planner/quarantine split, and a prompt-injection benchmark"
requires-python = ">=3.10"
dependencies = []   # the core is pure standard library

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[tool.setuptools]
packages = ["airlock", "server"]

[tool.setuptools.package-data]
server = ["index.html"]
